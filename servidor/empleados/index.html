<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sporta - Empleados</title>

  <link rel="stylesheet" href="../recursos/css/global.css">
  <link rel="stylesheet" href="../recursos/css/layout.css">
  <link rel="stylesheet" href="../recursos/css/componentes.css">
  <link rel="stylesheet" href="../recursos/css/drawer.css">

  <link id="page-style" rel="stylesheet" href="empleados.css">
</head>

<body class="screen" data-page="Empleados" data-drawer="empleados">

  <div class="background"></div>

  <div id="sidebar-container"></div>

  <button class="menu-toggle" id="menuToggle">☰</button>

  <div class="app-content">

  <div id="header-container"></div>

  <main class="main-content">

    <div class="list-container">
      <h2>Empleados</h2>
      <p>Listado de empleados registrados</p>
    </div>

    <div id="flashContainer"></div>

    <div class="table-toolbar">
      <input type="text" id="tableSearch" class="table-search" placeholder="Buscar empleado...">
      <label class="filter-inactivos">
        <input type="checkbox" id="showInactivos"> Mostrar inactivos
      </label>
    </div>

    <div class="table-container">
      <table class="table">
        <thead>
          <tr>
            <th data-sort="0" data-column="id">ID</th>
            <th data-sort="1" data-column="nombre">Nombre</th>
            <th data-sort="2" data-column="apellido">Apellido</th>
            <th data-sort="3" data-column="email">Email</th>
            <th data-sort="4" data-column="celular">Celular</th>
            <th data-sort="5" data-column="dni">DNI</th>
            <th data-sort="6" data-column="usuario">Usuario</th>
            <th data-sort="7" data-column="direccion">Dirección</th>
            <th data-sort="8" data-column="rol">Rol</th>
            <th data-sort="9" data-column="estado">Estado</th>
            <th data-column="acciones">Acciones</th>
          </tr>
        </thead>
        <tbody id="empleadosTableBody"></tbody>
      </table>
    </div>

    <button class="fab">+</button>

  </main>

  </div>

  <div id="drawer-container"></div>

  <div id="toast-container"></div>

  <script src="../recursos/js/layout.js"></script>
  <script src="../recursos/js/table.js"></script>
  <script src="../recursos/js/drawer.js"></script>
  <script src="../recursos/js/validacion.js"></script>
  <script src="empleados.js"></script>

</body>
</html>

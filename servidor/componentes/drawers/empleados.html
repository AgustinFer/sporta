<!-- OVERLAY -->
<div class="drawer-overlay"></div>

<!-- DRAWER -->
<aside class="drawer">

  <div class="drawer-header">
    <h3 id="drawer-title">Nuevo empleado</h3>
    <button type="button" class="drawer-close">✕</button>
  </div>

  <form class="drawer-form" id="formEmpleado" novalidate>

    <input type="hidden" name="edit_empleado_id" id="edit_empleado_id">

    <div>
      <label>Nombre <span class="required">*</span></label>
      <input type="text" name="empleado_nombre" id="empleado_nombre" pattern="[a-zA-ZáéíóúüñÁÉÍÓÚÜÑ\s]+" title="Solo se permiten letras" data-validate="soloLetras" required>
      <span class="field-error" id="error_empleado_nombre"></span>
    </div>

    <div>
      <label>Apellido <span class="required">*</span></label>
      <input type="text" name="empleado_apellido" id="empleado_apellido" pattern="[a-zA-ZáéíóúüñÁÉÍÓÚÜÑ\s]+" title="Solo se permiten letras" data-validate="soloLetras" required>
      <span class="field-error" id="error_empleado_apellido"></span>
    </div>

    <div>
      <label>Usuario <span class="required">*</span></label>
      <input type="text" name="empleado_usuario" id="empleado_usuario" required>
    </div>

    <div>
      <label>Rol <span class="required">*</span></label>
      <select name="empleado_rol" id="empleado_rol" required>
        <option value="">Seleccionar rol</option>
        <option value="1">Administrador</option>
        <option value="2">Empleado</option>
      </select>
    </div>

    <div>
      <label>Teléfono</label>
      <input type="text" name="empleado_celular" id="empleado_celular" pattern="\d{1,10}" title="Solo se permiten números, máximo 10 dígitos" data-validate="telefono" maxlength="10" inputmode="numeric">
      <span class="field-error" id="error_empleado_celular"></span>
    </div>

    <div>
      <label>Email</label>
      <input type="email" name="empleado_email" id="empleado_email" data-validate="email">
      <span class="field-error" id="error_empleado_email"></span>
    </div>

    <div>
      <label>DNI</label>
      <input type="text" name="empleado_dni" id="empleado_dni" pattern="\d{1,8}" title="Solo se permiten números, máximo 8 dígitos" data-validate="soloNumeros" maxlength="8" inputmode="numeric">
      <span class="field-error" id="error_empleado_dni"></span>
    </div>

    <div>
      <label>Dirección</label>
      <input type="text" name="empleado_direccion" id="empleado_direccion">
    </div>

    <button type="submit" class="drawer-submit">Guardar empleado</button>
  </form>

</aside>

<!-- OVERLAY -->
<div class="drawer-overlay"></div>

<!-- DRAWER -->
<aside class="drawer">

  <div class="drawer-header">
    <h3 id="drawer-title">Nuevo cliente</h3>
    <button type="button" class="drawer-close">✕</button>
  </div>

  <form class="drawer-form" id="formCliente" novalidate>

    <input type="hidden" name="edit_cliente_id" id="edit_cliente_id">

    <div>
      <label>Nombre <span class="required">*</span></label>
      <input type="text" name="cliente_nombre" id="cliente_nombre" pattern="[a-zA-ZáéíóúüñÁÉÍÓÚÜÑ\s]+" title="Solo se permiten letras" data-validate="soloLetras" required>
      <span class="field-error" id="error_cliente_nombre"></span>
    </div>

    <div>
      <label>Apellido <span class="required">*</span></label>
      <input type="text" name="cliente_apellido" id="cliente_apellido" pattern="[a-zA-ZáéíóúüñÁÉÍÓÚÜÑ\s]+" title="Solo se permiten letras" data-validate="soloLetras" required>
      <span class="field-error" id="error_cliente_apellido"></span>
    </div>

    <div>
      <label>Teléfono <span class="required">*</span></label>
      <input type="text" name="cliente_celular" id="cliente_celular" pattern="\d{7,10}" title="Solo números, entre 7 y 10 dígitos" data-validate="telefono" maxlength="10" inputmode="numeric" required>
      <span class="field-error" id="error_cliente_celular"></span>
    </div>

    <div>
      <label>Email</label>
      <input type="email" name="cliente_email" id="cliente_email" data-validate="email">
      <span class="field-error" id="error_cliente_email"></span>
    </div>

    <div>
      <label>DNI</label>
      <input type="text" name="cliente_dni" id="cliente_dni" pattern="\d{7,8}" title="Solo números, entre 7 y 8 dígitos" data-validate="soloNumeros" maxlength="8" inputmode="numeric">
      <span class="field-error" id="error_cliente_dni"></span>
    </div>

    <button type="submit" class="drawer-submit">Guardar cliente</button>
  </form>

</aside>

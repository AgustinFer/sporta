<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sporta - Logs</title>

  <link rel="stylesheet" href="../recursos/css/global.css">
  <link rel="stylesheet" href="../recursos/css/layout.css">
  <link rel="stylesheet" href="../recursos/css/componentes.css">
  <link rel="stylesheet" href="../recursos/css/drawer.css">

  <link id="page-style" rel="stylesheet" href="logs.css">
</head>

<body class="screen" data-page="Logs">

  <div class="background"></div>

  <div id="sidebar-container"></div>

  <button class="menu-toggle" id="menuToggle">☰</button>

  <div class="app-content">

  <div id="header-container"></div>

  <main class="main-content">

    <div class="list-container">
      <h2>Logs del sistema</h2>
      <p>Registro de actividades del sistema</p>
    </div>

    <div class="table-toolbar">
      <input type="text" id="tableSearch" class="table-search" placeholder="Buscar en logs...">

      <label class="filter-date">
        Fecha
        <input type="date" id="filterFecha">
      </label>

    </div>

    <div class="table-container">
      <table class="table">
        <thead>
          <tr>
            <th data-sort="0" data-column="hora">Hora</th>
            <th data-sort="1" data-column="usuario">Usuario</th>
            <th data-sort="2" data-column="accion">Acción</th>
            <th data-sort="3" data-column="ip">IP</th>
            <th data-column="detalle">Detalle</th>
          </tr>
        </thead>
        <tbody id="logsTableBody"></tbody>
      </table>
    </div>

  </main>

  </div>

  <div id="drawer-container"></div>

  <div id="toast-container"></div>

  <script src="../recursos/js/layout.js"></script>
  <script src="../recursos/js/table.js"></script>
  <script src="../recursos/js/drawer.js"></script>
  <script src="logs.js"></script>
</body>
</html>

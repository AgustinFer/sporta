<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sporta - Clientes</title>

  <!-- CSS GLOBAL -->
  <link rel="stylesheet" href="/assets/css/global.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/drawer.css">

  <!-- CSS MÓDULO -->
  <link id="page-style" rel="stylesheet" href="/clientes/clientes.css">
</head>

<body class="screen" data-page="Clientes">

  <!-- FONDO -->
  <div class="background"></div>

  <!-- SIDEBAR DINÁMICO -->
  <div id="sidebar-container"></div>

  <!-- BOTÓN MOBILE -->
  <button class="menu-toggle" id="menuToggle">☰</button>

  <!-- CONTENIDO -->
  <main class="main-content">

    <!-- HEADER DINÁMICO -->
    <div id="header-container"></div>

    <div class="list-container">
      <h2>Clientes</h2>
      <p>Listado de clientes registrados</p>
    </div>

    <!-- FAB -->
    <button class="fab">+</button>

  </main>

  <!-- DRAWER -->
  <div id="drawer-container"></div>

  <!-- JS LAYOUT (carga sidebar + header) -->
  <script src="/assets/js/layout.js"></script>

  <script src="/assets/js/drawer.js"></script>

  <script>
    async function loadDrawer() {

      try {

        const response = await fetch("/components/drawer.html");
        const html = await response.text();

        document.getElementById("drawer-container").innerHTML = html;

        initDrawer();

      } catch (err) {

        console.error(err);

      }

    }

    loadDrawer();
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sporta - Turnos</title>

  <link rel="stylesheet" href="../recursos/css/global.css">
  <link rel="stylesheet" href="../recursos/css/layout.css">
  <link rel="stylesheet" href="../recursos/css/componentes.css">
  <link rel="stylesheet" href="../recursos/css/drawer.css">

  <link id="page-style" rel="stylesheet" href="turnos.css">
</head>

<body class="screen" data-page="Turnos" data-drawer="turnos">

  <div class="background"></div>

  <div id="sidebar-container"></div>

  <button class="menu-toggle" id="menuToggle">☰</button>

  <div class="app-content">

  <div id="header-container"></div>

  <main class="main-content">

    <div class="turnos-toolbar">
      <h2 id="tituloFecha" class="titulo-fecha">Cargando fecha...</h2>
      <div class="turnos-filtros">
        <label for="fechaSeleccionada">Fecha:</label>
        <input type="date" id="fechaSeleccionada">
      </div>
    </div>

    <div class="contenedor-tabla">
      <table id="tablaTurnos">
        <thead>
          <tr id="filaCanchas">
            <th class="columna-hora">Horario</th>
          </tr>
        </thead>
        <tbody id="cuerpoTabla"></tbody>
      </table>
    </div>

    <button class="fab">+</button>

  </main>

  </div>

  <div id="drawer-container"></div>

  <div id="toast-container"></div>

  <script src="../recursos/js/layout.js"></script>
  <script src="../recursos/js/table.js"></script>
  <script src="../recursos/js/drawer.js"></script>
  <script src="../recursos/js/turnos.js"></script>
</body>
</html>

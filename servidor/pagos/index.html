<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sporta - Pagos</title>

  <link rel="stylesheet" href="../recursos/css/global.css">
  <link rel="stylesheet" href="../recursos/css/layout.css">
  <link rel="stylesheet" href="../recursos/css/componentes.css">
  <link rel="stylesheet" href="../recursos/css/drawer.css">

  <link id="page-style" rel="stylesheet" href="pagos.css">
</head>

<body class="screen" data-page="Pagos" data-drawer="pagos">

  <div class="background"></div>

  <div id="sidebar-container"></div>

  <button class="menu-toggle" id="menuToggle">☰</button>

  <div class="app-content">

  <div id="header-container"></div>

  <main class="main-content">

    <div class="list-container">
      <h2>Pagos</h2>
      <p>Todos los pagos registrados</p>
    </div>

    <div class="table-toolbar">
      <input type="text" id="tableSearch" class="table-search" placeholder="Buscar pago...">

      <label class="filter-date">
        Desde
        <input type="date" id="filterFechaDesde">
      </label>
      <label class="filter-date">
        Hasta
        <input type="date" id="filterFechaHasta">
      </label>
    </div>

    <div class="table-container">
      <table class="table">
        <thead>
          <tr>
            <th data-sort="0" data-column="cliente">Cliente</th>
            <th data-sort="1" data-column="cancha">Cancha</th>
            <th data-sort="2" data-column="fecha">Fecha</th>
            <th data-sort="3" data-column="metodo">Método</th>
            <th data-sort="4" data-column="monto">Monto</th>
            <th data-sort="5" data-column="factura">Factura</th>
            <th data-column="acciones">Acciones</th>
          </tr>
        </thead>
        <tbody id="pagosTableBody"></tbody>
      </table>
    </div>

  </main>

  </div>

  <div id="drawer-container"></div>

  <div id="toast-container"></div>

  <script src="../recursos/js/layout.js"></script>
  <script src="../recursos/js/table.js"></script>
  <script src="../recursos/js/drawer.js"></script>
  <script src="pagos.js"></script>
</body>
</html>
